name: Update GitHub Streak

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Latest Streak SVG
        run: |
          curl -s -H "User-Agent: Mozilla/5.0" "https://streak-stats.demolab.com/?user=GuruMachanica&theme=dark&hide_border=true" -o assets/github-streak.svg
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/github-streak.svg
          git commit -m "Auto-update GitHub streak stats SVG" || exit 0
          git push
